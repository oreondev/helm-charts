# Echo server that logs every webhook call; its log shows which receiver
# (URL path) received which alerts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: alert-sink}
  template:
    metadata:
      labels: {app: alert-sink}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_IGNORE_PATH, value: "/healthz"}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: monitoring
spec:
  selector: {app: alert-sink}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Secret
metadata:
  name: alert-sink
  namespace: monitoring
stringData:
  page-url: http://alert-sink.monitoring.svc/page
  ticket-url: http://alert-sink.monitoring.svc/ticket
