name: release

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      - name: Package and publish changed charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish artifacthub-repo.yml next to index.yaml
        run: |
          cp artifacthub-repo.yml /tmp/artifacthub-repo.yml
          git fetch origin gh-pages || exit 0
          git checkout gh-pages
          cp /tmp/artifacthub-repo.yml artifacthub-repo.yml
          if ! git diff --quiet -- artifacthub-repo.yml || [ -n "$(git ls-files --others --exclude-standard artifacthub-repo.yml)" ]; then
            git add artifacthub-repo.yml
            git commit -m "Update artifacthub-repo.yml"
            git push origin gh-pages
          fi
