name: release

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "dashboards/build.py"
      - "artifacthub-repo.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4

      - name: Package and publish changed charts
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish artifacthub-repo.yml next to index.yaml
        run: |
          cp artifacthub-repo.yml /tmp/artifacthub-repo.yml
          git fetch origin gh-pages || exit 0
          git checkout gh-pages
          cp /tmp/artifacthub-repo.yml artifacthub-repo.yml
          if ! git diff --quiet -- artifacthub-repo.yml || [ -n "$(git ls-files --others --exclude-standard artifacthub-repo.yml)" ]; then
            git add artifacthub-repo.yml
            git commit -m "Update artifacthub-repo.yml"
            git push origin gh-pages
          fi

      - name: Regenerate the landing page from index.yaml
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pyyaml
          git checkout -- . 2>/dev/null || true
          git show origin/main:.github/pages/render.py > /tmp/render.py
          mkdir -p /tmp/pages && for f in oreon-logo.svg favicon.svg; do git show origin/main:.github/pages/$f > /tmp/pages/$f; done
          cp /tmp/render.py /tmp/pages/render.py
          git fetch origin gh-pages && git checkout gh-pages && git reset --hard origin/gh-pages
          python3 /tmp/pages/render.py .
          if [ -n "$(git status --porcelain)" ]; then
            git add index.html oreon-logo.svg favicon.svg
            git commit -m "Regenerate landing page"
            git push origin gh-pages
          fi

      # Last, so a dashboard build problem never holds up a chart release. The push uses GITHUB_TOKEN, which does not
      # start another workflow run.
      - name: Regenerate dashboards/ from the chart dashboards
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 dashboards/build.py
          if [ -n "$(git status --porcelain -- dashboards)" ]; then
            git add dashboards
            git commit -m "Regenerate dashboards/ from the chart dashboards"
            git pull --rebase origin main
            git push origin main
          fi
