{{- $p := .Values.policies.disallowLatestTag }}
{{- if $p.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Values.namePrefix }}disallow-latest-tag
  labels:
    {{- include "kpp.labels" . | nindent 4 }}
  annotations:
    {{- include "kpp.annotations" (dict "title" "Disallow latest and untagged images" "severity" "medium" "subject" "Pod" "description" "An image without a tag, or tagged latest, cannot be rolled back and makes two pods of the same Deployment run different code. Every container image must have an explicit tag or digest.") | nindent 4 }}
spec:
  background: {{ .Values.background }}
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- include "kpp.exclude" . | nindent 6 }}
      validate:
        {{- include "kpp.failure" . | nindent 8 }}
        message: "An image tag or digest is required."
        pattern:
          spec:
            containers:
              - image: "*:*"
            =(initContainers):
              - image: "*:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds:
                - Pod
      {{- include "kpp.exclude" . | nindent 6 }}
      validate:
        {{- include "kpp.failure" . | nindent 8 }}
        message: "The image tag 'latest' is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
{{- end }}
