# Cluster-wide PriorityClasses (optional).
priorityClasses: []
#  - name: tenant-critical
#    value: 100000
#    description: Customer-facing workloads that must be scheduled first.
#  - name: tenant-batch
#    value: -1000
#    preemptionPolicy: Never
#    description: Batch work that may wait.

# PrometheusRule alerting on namespaces close to their quota (needs kube-state-metrics
# and the Prometheus Operator CRDs).
monitoring:
  enabled: false
  # Labels for the Prometheus Operator ruleSelector (kube-prometheus-stack: release: <name>).
  labels: {}
  nearLimitThreshold: 0.9
  nearLimitSeverity: warning
  exhaustedSeverity: critical
