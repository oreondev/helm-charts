apiVersion: v2
name: namespace-baseline
description: Guardrails for every team namespace from one values file - Pod Security Admission labels, ResourceQuota, LimitRange, default-deny NetworkPolicies with the usual allows (DNS, same namespace, ingress controller, monitoring), RBAC bindings for team groups and optional quota alerts.
