{{- range $ns := .Values.namespaces }}
{{- $cfg := mergeOverwrite (deepCopy $.Values.defaults) (deepCopy $ns) }}
{{- if $cfg.rbac.enabled }}
{{- range $role, $key := dict "admin" "admins" "edit" "editors" "view" "viewers" }}
{{- $subjects := index $cfg.rbac $key }}
{{- if $subjects }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: baseline-{{ $role }}
  namespace: {{ $ns.name }}
  labels:
    {{- include "nsb.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role }}
subjects:
  {{- include "nsb.subjects" $subjects | trim | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
