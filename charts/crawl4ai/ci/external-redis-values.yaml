# chart-testing: two replicas on an external Redis (a throwaway one next to the release).
replicaCount: 2
redis:
  mode: external
  external:
    host: "{{ .Release.Name }}-redis"
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
extraObjects:
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-redis
    spec:
      selector: { matchLabels: { app: {{ .Release.Name }}-redis } }
      template:
        metadata: { labels: { app: {{ .Release.Name }}-redis } }
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              ports: [{ containerPort: 6379 }]
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-redis
    spec:
      selector: { app: {{ .Release.Name }}-redis }
      ports: [{ port: 6379 }]
