{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawl4ai.fullname" . }}-dashboard
  labels:
    {{- include "crawl4ai.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  crawl4ai.json: |-
    {{- .Files.Get "dashboards/crawl4ai.json" | nindent 4 }}
{{- end }}
