{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mem0.fullname" . }}-grafana-dashboard
  labels:
    {{- include "mem0.labels" (dict "ctx" . "component" "server") | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  mem0.json: |-
    {{- .Files.Get "dashboards/mem0.json" | nindent 4 }}
{{- end }}
