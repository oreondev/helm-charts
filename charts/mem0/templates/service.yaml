apiVersion: v1
kind: Service
metadata:
  name: {{ include "mem0.serverName" . }}
  labels:
    {{- include "mem0.labels" (dict "ctx" . "component" "server") | nindent 4 }}
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "mem0.selectorLabels" (dict "ctx" . "component" "server") | nindent 4 }}
{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mem0.dashboardName" . }}
  labels:
    {{- include "mem0.labels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "mem0.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
{{- end }}
