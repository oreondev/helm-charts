{{- if .Values.httpRoute.enabled }}
{{- $h := .Values.httpRoute }}
{{- $routes := list (dict "name" (include "mem0.serverName" .) "component" "server" "hostnames" $h.api.hostnames "port" .Values.server.service.port) }}
{{- if .Values.dashboard.enabled }}
{{- $routes = append $routes (dict "name" (include "mem0.dashboardName" .) "component" "dashboard" "hostnames" $h.dashboard.hostnames "port" .Values.dashboard.service.port) }}
{{- end }}
{{- range $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  labels:
    {{- include "mem0.labels" (dict "ctx" $ "component" .component) | nindent 4 }}
  {{- with $h.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "httpRoute.parentRefs: name the Gateway to attach to" $h.parentRefs | toYaml | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .name }}
          port: {{ .port }}
      {{- with $h.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
