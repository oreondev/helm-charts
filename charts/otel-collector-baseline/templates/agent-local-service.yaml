{{- if and .Values.agent.enabled .Values.agent.receivers.otlp.enabled }}
{{- $name := include "otel.agentName" . }}
# Node-local entry point for applications: traffic stays on the node the pod runs on.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel.agentLocalService" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: {{ include "otel.instanceLabel" (dict "ns" .Release.Namespace "name" $name) }}
    app.kubernetes.io/managed-by: opentelemetry-operator
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
{{- end }}
