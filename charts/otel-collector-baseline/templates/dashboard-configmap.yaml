{{- if and .Values.monitoring.enabled .Values.monitoring.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otel.fullname" . }}-dashboard
  namespace: {{ .Values.monitoring.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "otel.labels" . | nindent 4 }}
    {{- with .Values.monitoring.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.monitoring.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  otel-collector.json: |-
    {{- .Files.Get "dashboards/otel-collector.json" | nindent 4 }}
{{- end }}
