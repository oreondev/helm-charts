apiVersion: v2
name: searxng
description: SearXNG metasearch on Kubernetes as the search backend for LLM tools and agents (Firecrawl, Open WebUI, Perplexica, LangChain) or as a public instance - JSON API mode, a curated engine set instead of 120 default engines, stable secret key across replicas, rate limiter with Valkey sidecar or external, non-root and read-only, NetworkPolicy, per-engine Prometheus metrics, alerts and a Grafana dashboard.
type: application
version: 0.1.1
appVersion: "2026.10.29-cff884f98"
