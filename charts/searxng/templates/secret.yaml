{{- include "searxng.validate" . }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "searxng.fullname" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
stringData:
  {{- with include "searxng.secretData" . | fromYaml }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
  # SearXNG only checks the password; Prometheus' basic auth needs a user name.
  metrics-user: searxng
  {{- end }}
  settings.yml: |
    {{- include "searxng.settings" . | nindent 4 }}
  limiter.toml: |
    {{- include "searxng.limiterToml" . | nindent 4 }}
