{{- if .Values.networkPolicy.enabled }}
{{- $n := .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "searxng.fullname" . }}
  labels:
    {{- include "searxng.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "searxng.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $n.allowedPodLabels }}
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- range $n.allowedNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        - namespaceSelector:
            {{- toYaml $n.metricsNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - { port: 8080, protocol: TCP }
{{- end }}
