apiVersion: v2
name: evolution
description: Evolution API (WhatsApp via Baileys or the Cloud API) for Kubernetes - migrations in an init container, Node as PID 1 with a heap cap sized from the memory limit, non-root and read-only, probes that do not call WhatsApp, Redis-backed sessions without a volume, generated API key, Ingress or Gateway API, and Prometheus metrics, ServiceMonitor and alerts.
type: application
version: 0.2.1
appVersion: "2.3.7"
kubeVersion: ">=1.25.0-0"
home: https://www.oreonit.com/containerization-orchestration-management-kubernetes-openshift/
icon: https://raw.githubusercontent.com/oreondev/helm-charts/main/icon.png
sources:
  - https://github.com/oreondev/helm-charts
  - https://github.com/evolution-foundation/evolution-api
keywords:
  - evolution-api
  - whatsapp
  - whatsapp-api
  - baileys
  - chatbot
  - n8n
  - chatwoot
  - messaging
maintainers:
  - name: Oreon IT
    email: info@oreonit.com
    url: https://www.oreonit.com/
