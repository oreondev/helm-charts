# chart-testing: a throwaway PostgreSQL and Redis next to the release (extraObjects), metrics on.
database:
  uri: postgresql://evolution:evolution@{{ .Release.Name }}-pg:5432/evolution?schema=evolution_api
redis:
  uri: redis://{{ .Release.Name }}-redis:6379/6
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi
extraObjects:
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-pg
    spec:
      selector: { matchLabels: { app: {{ .Release.Name }}-pg } }
      template:
        metadata: { labels: { app: {{ .Release.Name }}-pg } }
        spec:
          containers:
            - name: postgres
              image: postgres:16-alpine
              env:
                - { name: POSTGRES_USER, value: evolution }
                - { name: POSTGRES_PASSWORD, value: evolution }
                - { name: POSTGRES_DB, value: evolution }
              ports: [{ containerPort: 5432 }]
              readinessProbe: { exec: { command: [pg_isready, -U, evolution] }, periodSeconds: 3 }
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-pg
    spec:
      selector: { app: {{ .Release.Name }}-pg }
      ports: [{ port: 5432 }]
  - |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .Release.Name }}-redis
    spec:
      selector: { matchLabels: { app: {{ .Release.Name }}-redis } }
      template:
        metadata: { labels: { app: {{ .Release.Name }}-redis } }
        spec:
          containers:
            - name: redis
              image: redis:7-alpine
              args: [--appendonly, "yes", --maxmemory-policy, noeviction]
              ports: [{ containerPort: 6379 }]
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-redis
    spec:
      selector: { app: {{ .Release.Name }}-redis }
      ports: [{ port: 6379 }]
