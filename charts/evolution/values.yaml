# Evolution API (WhatsApp, Baileys and the Cloud API) on Kubernetes.
# Bring your own PostgreSQL and Redis; the chart runs the migrations, the API and the manager UI.

image:
  repository: evoapicloud/evolution-api
  # Defaults to "v" + appVersion. Pin a tag (or a digest) in production; "latest" moves under you.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Public URL of the API (SERVER_URL). Used in webhook payloads, media URLs and the manager link.
# Empty: https://<first ingress or HTTPRoute host>, else the in-cluster Service URL.
serverUrl: ""

# The built-in manager UI on /manager (SERVER_DISABLE_MANAGER when false).
manager:
  enabled: true

auth:
  # Global API key (AUTHENTICATION_API_KEY); every request sends it as the "apikey" header.
  # Empty: a random 32-character key is generated once and kept across upgrades.
  apiKey: ""
  # Use a key from your own Secret instead (key name below).
  existingSecret: ""
  existingSecretKey: AUTHENTICATION_API_KEY
  # List every instance on GET /instance/fetchInstances to holders of the global key only.
  exposeInFetchInstances: false

database:
  # postgresql (the image's generated client) or mysql (the client is regenerated by an init container).
  provider: postgresql
  # postgresql://user:pass@host:5432/evolution?schema=evolution_api (templated, so {{ .Release.Name }} works)
  # With PgBouncer, point this at PgBouncer (add pgbouncer=true) and set migrationUri to the direct server.
  uri: ""
  existingSecret: ""
  existingSecretKey: DATABASE_CONNECTION_URI
  # Separates installs that share one database (DATABASE_CONNECTION_CLIENT_NAME).
  clientName: evolution
  migrations:
    # Run "prisma migrate deploy" in an init container before the API starts.
    enabled: true
    # Direct (session-mode) connection for migrations; empty = uri.
    uri: ""
    existingSecret: ""
    existingSecretKey: DATABASE_MIGRATION_URI
  # What the API stores. Message history from the phone is the expensive one: on every new
  # connection WhatsApp pushes months of chats, which costs CPU, database rows and minutes.
  save:
    instance: true
    newMessage: true
    messageUpdate: true
    contacts: true
    chats: true
    labels: true
    historic: false
    isOnWhatsapp: true
    isOnWhatsappDays: 7
  deleteMessage: true

redis:
  # Strongly recommended. With Redis the Baileys signal keys live in Redis and the pod needs no volume;
  # without it they are files under /evolution/instances and persistence must be enabled.
  # Run Redis with persistence (AOF) and maxmemory-policy noeviction: evicted keys log the phones out.
  enabled: true
  # redis://:password@redis-master:6379/6
  uri: ""
  existingSecret: ""
  existingSecretKey: CACHE_REDIS_URI
  prefix: evolution
  ttl: 604800
  # Keep connection state in Redis instead of the database.
  saveInstances: false

metrics:
  # Prometheus metrics on /metrics (evolution_instances_total, evolution_instance_up, evolution_instance_state).
  enabled: false
  username: prometheus
  # Empty: generated once and kept across upgrades.
  password: ""
  existingSecret: ""
  existingSecretKey: METRICS_PASSWORD
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Alert when a WhatsApp instance has been disconnected this long.
    instanceDownFor: 15m
    # Instances that are meant to stay disconnected (regex on the instance name).
    ignoreInstances: ""
    severity: warning

# Any other Evolution API variable (https://doc.evolution-api.com), rendered into a ConfigMap.
# Overrides the chart defaults below; secrets belong in secretEnv or extraEnvFrom.
config: {}
#  WEBHOOK_GLOBAL_ENABLED: "true"
#  WEBHOOK_GLOBAL_URL: https://n8n.example.com/webhook/whatsapp
#  WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
#  S3_ENABLED: "true"
#  S3_BUCKET: evolution-media
#  S3_ENDPOINT: storage.googleapis.com

# Chart defaults, overridden key by key by config.
defaults:
  LOG_LEVEL: ERROR,WARN,INFO
  LOG_COLOR: "false"
  LOG_BAILEYS: error
  TELEMETRY_ENABLED: "false"
  TZ: UTC
  LANGUAGE: en
  DEL_INSTANCE: "false"
  CORS_ORIGIN: "*"
  CORS_METHODS: GET,POST,PUT,DELETE
  CORS_CREDENTIALS: "true"
  EVENT_EMITTER_MAX_LISTENERS: "50"
  CONFIG_SESSION_PHONE_CLIENT: Evolution API
  CONFIG_SESSION_PHONE_NAME: Chrome
  QRCODE_LIMIT: "30"
  QRCODE_COLOR: "#175197"
  WEBSOCKET_ENABLED: "false"

# Secret variables (rendered into the chart's Secret), e.g. S3_SECRET_KEY, OPENAI_API_KEY.
secretEnv: {}

# The image ships the upstream .env.example as /evolution/.env, which the API loads for every variable
# not set here: an example API key, telemetry to log.evolution-api.com, verbose logs. Mask it with an
# empty file so only what this chart sets applies.
maskImageDotenv: true

extraEnv: []
# - name: S3_SECRET_KEY
#   valueFrom: { secretKeyRef: { name: s3, key: secret } }
# Loaded after the chart's ConfigMap and Secret, so keys here win over them.
extraEnvFrom: []
# - configMapRef: { name: evolution-cm }
# - secretRef: { name: evolution-secret }

# WhatsApp sessions are live sockets held in the API process. Two pods would connect the same
# sessions and log each other out, so this chart runs exactly one replica with the Recreate strategy.
# Scale up with resources, or split tenants across releases with different clientName.

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi
# V8 heap cap. Empty: 75% of resources.limits.memory, so Node collects garbage before the kernel kills it.
nodeMaxOldSpaceMB: ""

persistence:
  # Needed only without Redis (signal keys on disk). Media without S3 lives in /evolution/store,
  # which is an emptyDir unless store.enabled.
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  store:
    enabled: false
    size: 5Gi

service:
  type: ClusterIP
  port: 8080
  # Fixed Service name; empty = the release full name.
  name: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # nginx.ingress.kubernetes.io/proxy-body-size: 136m
  # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: evolution.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: evolution-tls
  #   hosts: [evolution.example.com]

# Gateway API route, e.g. onto the Gateway from gateway-api-baseline.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  # - name: shared
  #   namespace: gateway
  #   sectionName: https-evolution
  hostnames: []
  # Long timeouts for websockets and large media uploads.
  timeouts:
    request: 300s

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# GET / fetches the current WhatsApp Web version from web.whatsapp.com on every call, so the probes
# use the static manager page instead (a TCP check if the manager is disabled).
probes:
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Sessions are closed by the process exiting; give in-flight webhooks time to finish.
terminationGracePeriodSeconds: 30

extraVolumes: []
extraVolumeMounts: []
extraInitContainers: []
# Arbitrary manifests rendered with the release (templated), e.g. a NetworkPolicy.
extraObjects: []
