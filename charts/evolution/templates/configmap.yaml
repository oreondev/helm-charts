{{- include "evolution.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evolution.fullname" . }}-env
  labels:
    {{- include "evolution.labels" . | nindent 4 }}
data:
  {{- include "evolution.env" . | trim | nindent 2 }}
{{- if .Values.maskImageDotenv }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evolution.fullname" . }}-dotenv
  labels:
    {{- include "evolution.labels" . | nindent 4 }}
data:
  .env: ""
{{- end }}
