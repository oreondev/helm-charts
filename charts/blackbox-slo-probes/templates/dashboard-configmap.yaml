{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bsp.fullname" . }}-dashboard
  namespace: {{ .Values.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "bsp.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  blackbox-slo-probes.json: |-
    {{- .Files.Get "dashboards/probes.json" | replace "__PERIOD__" (printf "%dd" (int .Values.sloPeriodDays)) | replace "__JOB__" .Values.probe.jobName | nindent 4 }}
{{- end }}
