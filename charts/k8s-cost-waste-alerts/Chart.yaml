apiVersion: v2
name: k8s-cost-waste-alerts
description: Find the money hiding in a Kubernetes cluster - recording rules, alerts and a Grafana dashboard for requests far above usage, under-committed nodes, idle PersistentVolumeClaims, LoadBalancers with no endpoints, HPAs stuck at max or pinned, containers without requests and workloads scaled to zero for weeks. Priced in your currency. Needs only kube-state-metrics and cAdvisor.
