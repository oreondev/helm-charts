{{- if .Values.prometheusRule.enabled }}
{{- /* Every kube-state-metrics series goes through "max without (job, instance, endpoint, service)": OpenCost and some
     agents re-export the same series under another job, which would otherwise count requests and capacity twice.
     kube_service_* and kube_endpoint_* keep service/endpoint, which are their own labels there; node and PVC series
     aggregate by their identity (node, resource / namespace, persistentvolumeclaim) because exporters add their own
     container and pod labels to those. */}}
{{- $ex := .Values.excludeNamespaces }}
{{- $t := .Values.thresholds }}
{{- $a := .Values.alerts }}
{{- $minMemBytes := mulf (float64 $t.minMemoryRequestGiB) 1073741824 }}
{{- $p := .Values.pricing }}
{{- $sv := .Values.savings }}
{{- if and $p.enabled (eq $p.source "instanceType") (empty $p.instanceTypes) }}
{{- fail "pricing.source=instanceType needs at least one entry in pricing.instanceTypes" }}
{{- end }}
{{- $spot := `max without (job, instance, endpoint, service) (kube_node_labels{label_karpenter_sh_capacity_type="spot"}) or max without (job, instance, endpoint, service) (kube_node_labels{label_eks_amazonaws_com_capacity_type="SPOT"}) or max without (job, instance, endpoint, service) (kube_node_labels{label_cloud_google_com_gke_spot="true"}) or max without (job, instance, endpoint, service) (kube_node_labels{label_cloud_google_com_gke_preemptible="true"}) or max without (job, instance, endpoint, service) (kube_node_labels{label_kubernetes_azure_com_scalesetpriority="spot"})` }}
{{- $nodes := `max by (node) (max without (job, instance, endpoint, service) (kube_node_info))` }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cw.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "cw.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: costwaste-recording
      interval: {{ .Values.prometheusRule.interval }}
      rules:
        - record: costwaste:pod_running:bool
          expr: max by (namespace, pod) (max without (job, instance, endpoint, service) (kube_pod_status_phase{phase="Running"}))
        - record: costwaste:namespace_cpu_requests:sum
          expr: |
            sum by (namespace) (
              max without (job, instance, endpoint, service) (kube_pod_container_resource_requests{resource="cpu", container!=""})
              * on (namespace, pod) group_left() costwaste:pod_running:bool
            )
        - record: costwaste:namespace_cpu_usage:sum
          expr: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!="", container!="POD", image!=""}[5m]))
        - record: costwaste:namespace_memory_requests:sum
          expr: |
            sum by (namespace) (
              max without (job, instance, endpoint, service) (kube_pod_container_resource_requests{resource="memory", container!=""})
              * on (namespace, pod) group_left() costwaste:pod_running:bool
            )
        - record: costwaste:namespace_memory_usage:sum
          expr: sum by (namespace) (container_memory_working_set_bytes{container!="", container!="POD", image!=""})
        - record: costwaste:namespace_cpu_waste:cores
          expr: clamp_min(costwaste:namespace_cpu_requests:sum - costwaste:namespace_cpu_usage:sum, 0)
        - record: costwaste:namespace_cpu_waste:ratio
          expr: costwaste:namespace_cpu_waste:cores / costwaste:namespace_cpu_requests:sum
        - record: costwaste:namespace_memory_waste:bytes
          expr: clamp_min(costwaste:namespace_memory_requests:sum - costwaste:namespace_memory_usage:sum, 0)
        - record: costwaste:namespace_memory_waste:ratio
          expr: costwaste:namespace_memory_waste:bytes / costwaste:namespace_memory_requests:sum
        - record: costwaste:cluster_cpu_allocatable:sum
          expr: sum(max by (node, resource) (kube_node_status_allocatable{resource="cpu"}))
        - record: costwaste:cluster_memory_allocatable:sum
          expr: sum(max by (node, resource) (kube_node_status_allocatable{resource="memory"}))
        - record: costwaste:cluster_cpu_commit:ratio
          expr: sum(costwaste:namespace_cpu_requests:sum) / costwaste:cluster_cpu_allocatable:sum
        - record: costwaste:cluster_memory_commit:ratio
          expr: sum(costwaste:namespace_memory_requests:sum) / costwaste:cluster_memory_allocatable:sum
        - record: costwaste:cluster_cpu_use:ratio
          expr: sum(costwaste:namespace_cpu_usage:sum) / costwaste:cluster_cpu_allocatable:sum
        - record: costwaste:cluster_memory_use:ratio
          expr: sum(costwaste:namespace_memory_usage:sum) / costwaste:cluster_memory_allocatable:sum
    {{- if $p.enabled }}
    # Node prices. Every source ends in the same three series per node: costwaste:node:hourly_cost,
    # costwaste:node_cpu_core:hourly_price and costwaste:node_memory_gib:hourly_price.
    - name: costwaste-node-prices
      interval: {{ .Values.prometheusRule.interval }}
      rules:
        - record: costwaste:node_static:hourly_cost
          expr: |
            sum by (node) (max by (node, resource) (kube_node_status_capacity{resource="cpu"})) * {{ $p.cpuCoreHour }}
            + sum by (node) (max by (node, resource) (kube_node_status_capacity{resource="memory"})) / 1073741824 * {{ $p.memoryGiBHour }}
        {{- if eq $p.source "opencost" }}
        - record: costwaste:node_spot:bool
          expr: max by (node) (kubecost_node_is_spot) or on (node) ({{ $nodes }} * 0)
        - record: costwaste:node:hourly_cost
          expr: max by (node) (node_total_hourly_cost)
        - record: costwaste:node_cpu_core:hourly_price
          expr: max by (node) (node_cpu_hourly_cost)
        - record: costwaste:node_memory_gib:hourly_price
          expr: max by (node) (node_ram_hourly_cost)
        {{- else }}
        - record: costwaste:node_spot:bool
          expr: max by (node) ({{ $spot }}) or on (node) ({{ $nodes }} * 0)
        {{- if eq $p.source "instanceType" }}
        - record: costwaste:node_list:hourly_cost
          expr: |
            max by (node) (
            {{- $first := true }}
            {{- range $type, $price := $p.instanceTypes }}
              {{ if not $first }}or {{ end }}max without (job, instance, endpoint, service) (kube_node_labels{label_node_kubernetes_io_instance_type={{ $type | quote }}}) * {{ $price }}
            {{- $first = false }}
            {{- end }}
            )
        - record: costwaste:node:hourly_cost
          expr: |
            (costwaste:node_list:hourly_cost or on (node) costwaste:node_static:hourly_cost)
            * on (node) (1 - {{ $p.spotDiscount }} * costwaste:node_spot:bool)
        {{- else }}
        - record: costwaste:node:hourly_cost
          expr: costwaste:node_static:hourly_cost
        {{- end }}
        # An instance price split into CPU and memory in the same ratio as cpuCoreHour : memoryGiBHour.
        - record: costwaste:node_cpu_core:hourly_price
          expr: costwaste:node:hourly_cost / costwaste:node_static:hourly_cost * {{ $p.cpuCoreHour }}
        - record: costwaste:node_memory_gib:hourly_price
          expr: costwaste:node:hourly_cost / costwaste:node_static:hourly_cost * {{ $p.memoryGiBHour }}
        {{- end }}
        - record: costwaste:node_info
          expr: |
            max by (node, instance_type) (
              label_replace(max without (job, instance, endpoint, service) (kube_node_labels), "instance_type", "$1", "label_node_kubernetes_io_instance_type", "(.+)")
              or on (node) label_replace({{ $nodes }}, "instance_type", "", "", "")
            )

    - name: costwaste-cost
      interval: {{ .Values.prometheusRule.interval }}
      rules:
        # Requests and usage per namespace and node, so every core is priced at the node it runs on.
        - record: costwaste:namespace_node_cpu_requests:sum
          expr: |
            sum by (namespace, node) (
              max without (job, instance, endpoint, service) (kube_pod_container_resource_requests{resource="cpu", container!=""})
              * on (namespace, pod) group_left() costwaste:pod_running:bool
            )
        - record: costwaste:namespace_node_memory_requests:sum
          expr: |
            sum by (namespace, node) (
              max without (job, instance, endpoint, service) (kube_pod_container_resource_requests{resource="memory", container!=""})
              * on (namespace, pod) group_left() costwaste:pod_running:bool
            )
        - record: costwaste:namespace_node_cpu_usage:sum
          expr: sum by (namespace, node) (rate(container_cpu_usage_seconds_total{container!="", container!="POD", image!=""}[5m]))
        - record: costwaste:namespace_node_memory_usage:sum
          expr: sum by (namespace, node) (container_memory_working_set_bytes{container!="", container!="POD", image!=""})
        - record: costwaste:node_cpu_requests:sum
          expr: sum by (node) (costwaste:namespace_node_cpu_requests:sum) or on (node) ({{ $nodes }} * 0)
        - record: costwaste:node_memory_requests:sum
          expr: sum by (node) (costwaste:namespace_node_memory_requests:sum) or on (node) ({{ $nodes }} * 0)

        # What the nodes cost, and what of it nobody has requested.
        - record: costwaste:node_cost:per_month
          expr: costwaste:node:hourly_cost * 730
        - record: costwaste:cluster_cost:per_month
          expr: sum(costwaste:node_cost:per_month)
        - record: costwaste:cluster_on_demand_cost:per_month
          expr: sum(costwaste:node_cost:per_month unless on (node) (costwaste:node_spot:bool == 1)) or vector(0)
        - record: costwaste:cluster_spot_cost:per_month
          expr: sum(costwaste:node_cost:per_month and on (node) (costwaste:node_spot:bool == 1)) or vector(0)
        - record: costwaste:node_idle_cost:per_month
          expr: |
            (
              clamp_min(sum by (node) (max by (node, resource) (kube_node_status_allocatable{resource="cpu"})) - costwaste:node_cpu_requests:sum, 0)
              * costwaste:node_cpu_core:hourly_price
              + clamp_min(sum by (node) (max by (node, resource) (kube_node_status_allocatable{resource="memory"})) - costwaste:node_memory_requests:sum, 0)
              / 1073741824 * costwaste:node_memory_gib:hourly_price
            ) * 730
        - record: costwaste:cluster_idle_cost:per_month
          expr: sum(costwaste:node_idle_cost:per_month)

        # Showback: each namespace pays for what it requests, at the price of the node it runs on.
        - record: costwaste:namespace_cost:per_month
          expr: |
            (
              sum by (namespace) (costwaste:namespace_node_cpu_requests:sum * on (node) group_left() costwaste:node_cpu_core:hourly_price)
              + sum by (namespace) (costwaste:namespace_node_memory_requests:sum * on (node) group_left() costwaste:node_memory_gib:hourly_price / 1073741824)
            ) * 730

        # Waste: requests above usage, priced per node.
        - record: costwaste:namespace_cpu_waste_cost:per_month
          expr: |
            sum by (namespace) (
              clamp_min(
                costwaste:namespace_node_cpu_requests:sum
                - (costwaste:namespace_node_cpu_usage:sum or on (namespace, node) costwaste:namespace_node_cpu_requests:sum * 0),
                0
              )
              * on (node) group_left() costwaste:node_cpu_core:hourly_price
            ) * 730
        - record: costwaste:namespace_memory_waste_cost:per_month
          expr: |
            sum by (namespace) (
              clamp_min(
                costwaste:namespace_node_memory_requests:sum
                - (costwaste:namespace_node_memory_usage:sum or on (namespace, node) costwaste:namespace_node_memory_requests:sum * 0),
                0
              )
              / 1073741824 * on (node) group_left() costwaste:node_memory_gib:hourly_price
            ) * 730
        - record: costwaste:namespace_waste_cost:per_month
          expr: costwaste:namespace_cpu_waste_cost:per_month + costwaste:namespace_memory_waste_cost:per_month
        - record: costwaste:waste_cost:per_month
          expr: sum(costwaste:namespace_waste_cost:per_month{namespace!~{{ $ex | quote }}}) or vector(0)
        - record: costwaste:waste_cost_all_namespaces:per_month
          expr: sum(costwaste:namespace_waste_cost:per_month) or vector(0)

        # Savings levers (per month). They overlap; read them one at a time.
        - record: costwaste:savings:per_month
          expr: costwaste:waste_cost:per_month
          labels:
            lever: rightsizing
        - record: costwaste:savings:per_month
          expr: costwaste:cluster_idle_cost:per_month * {{ subf 1.0 $sv.idleHeadroom }}
          labels:
            lever: consolidation
        - record: costwaste:savings:per_month
          expr: costwaste:cluster_on_demand_cost:per_month * {{ $sv.spotEligibleShare }} * {{ $p.spotDiscount }}
          labels:
            lever: spot
        - record: costwaste:savings:per_month
          expr: min_over_time(costwaste:cluster_on_demand_cost:per_month[7d]) * {{ $sv.commitmentDiscount }}
          labels:
            lever: commitment
        - record: costwaste:savings:per_month
          expr: |
            (
              sum(
                (
                  max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_info{namespace!~{{ $ex | quote }}})
                  unless on (namespace, persistentvolumeclaim) max without (job, instance, endpoint, service) (kube_pod_spec_volumes_persistentvolumeclaims_info)
                )
                * on (namespace, persistentvolumeclaim) group_left() max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes)
              ) / 1073741824 * {{ $p.storageGiBMonth }}
            ) or vector(0)
          labels:
            lever: idle_volumes
        - record: costwaste:savings:per_month
          expr: |
            (
              count(
                max without (job, instance) (kube_service_spec_type{type="LoadBalancer", namespace!~{{ $ex | quote }}})
                unless on (namespace, service)
                (label_replace(sum by (namespace, endpoint) (max without (job, instance) (kube_endpoint_address{ready="true"})), "service", "$1", "endpoint", "(.*)") > 0)
              ) * {{ $p.loadBalancerHour }} * 730
            ) or vector(0)
          labels:
            lever: idle_load_balancers
    {{- end }}
    - name: costwaste-alerts
      rules:
        {{- if $a.namespaceOverRequested.enabled }}
        - alert: NamespaceCPUOverRequested
          expr: |
            avg_over_time(costwaste:namespace_cpu_waste:ratio{namespace!~{{ $ex | quote }}}[1d]) > {{ $t.cpuWasteRatio }}
            and costwaste:namespace_cpu_requests:sum > {{ $t.minCpuRequestCores }}
          for: {{ $a.namespaceOverRequested.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.namespaceOverRequested.severity) | nindent 12 }}
          annotations:
            summary: 'Namespace {{ `{{ $labels.namespace }}` }} leaves {{ `{{ $value | humanizePercentage }}` }} of its CPU requests unused (24h average)'
            description: 'Requests are sized well above use, so the cluster holds nodes for capacity nobody consumes. Right-size the requests (VPA recommendations or the cost dashboard) and let the autoscaler remove nodes.'
        - alert: NamespaceMemoryOverRequested
          expr: |
            avg_over_time(costwaste:namespace_memory_waste:ratio{namespace!~{{ $ex | quote }}}[1d]) > {{ $t.memoryWasteRatio }}
            and costwaste:namespace_memory_requests:sum > {{ printf "%.0f" $minMemBytes }}
          for: {{ $a.namespaceOverRequested.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.namespaceOverRequested.severity) | nindent 12 }}
          annotations:
            summary: 'Namespace {{ `{{ $labels.namespace }}` }} leaves {{ `{{ $value | humanizePercentage }}` }} of its memory requests unused (24h average)'
            description: 'Memory requests far above the working set are the most common Kubernetes cost leak. Right-size them; memory is what usually decides node count.'
        {{- end }}
        {{- if $a.clusterUnderCommitted.enabled }}
        - alert: ClusterCPUUnderCommitted
          expr: avg_over_time(costwaste:cluster_cpu_commit:ratio[1d]) < {{ $t.clusterCpuCommitRatio }}
          for: {{ $a.clusterUnderCommitted.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.clusterUnderCommitted.severity) | nindent 12 }}
          annotations:
            summary: 'Only {{ `{{ $value | humanizePercentage }}` }} of allocatable CPU is requested across the cluster'
            description: 'Nodes are oversized or the cluster autoscaler is not scaling in. Check node pool minimums, PodDisruptionBudgets that block scale-down, and system pods pinning nodes.'
        - alert: ClusterMemoryUnderCommitted
          expr: avg_over_time(costwaste:cluster_memory_commit:ratio[1d]) < {{ $t.clusterMemoryCommitRatio }}
          for: {{ $a.clusterUnderCommitted.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.clusterUnderCommitted.severity) | nindent 12 }}
          annotations:
            summary: 'Only {{ `{{ $value | humanizePercentage }}` }} of allocatable memory is requested across the cluster'
            description: 'Nodes are oversized or the cluster autoscaler is not scaling in. Consider smaller machine types or a lower node pool minimum.'
        {{- end }}
        {{- if $a.idlePvc.enabled }}
        - alert: UnusedPersistentVolumeClaim
          expr: |
            (
              max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_info{namespace!~{{ $ex | quote }}})
              unless on (namespace, persistentvolumeclaim) max without (job, instance, endpoint, service) (kube_pod_spec_volumes_persistentvolumeclaims_info)
            )
            * on (namespace, persistentvolumeclaim) group_left() max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes)
          for: {{ $a.idlePvc.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.idlePvc.severity) | nindent 12 }}
          annotations:
            summary: 'PVC {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.persistentvolumeclaim }}` }} ({{ `{{ $value | humanize1024 }}` }}B) has not been mounted by any pod for {{ $a.idlePvc.for }}'
            description: 'The disk is billed whether or not a pod uses it. Snapshot and delete it, or document why it stays.'
        {{- end }}
        {{- if $a.unusedLoadBalancer.enabled }}
        - alert: UnusedLoadBalancerService
          expr: |
            (
              max without (job, instance) (kube_service_spec_type{type="LoadBalancer", namespace!~{{ $ex | quote }}})
              unless on (namespace, service)
              (label_replace(sum by (namespace, endpoint) (max without (job, instance) (kube_endpoint_address{ready="true"})), "service", "$1", "endpoint", "(.*)") > 0)
            )
            and on () (count(max without (job, instance) (kube_endpoint_address)) > 0)
          for: {{ $a.unusedLoadBalancer.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.unusedLoadBalancer.severity) | nindent 12 }}
          annotations:
            summary: 'LoadBalancer service {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.service }}` }} has had no ready endpoints for {{ $a.unusedLoadBalancer.for }}'
            description: 'A cloud load balancer is billed per hour whether or not it serves traffic. Fix the selector or delete the service.'
        {{- end }}
        {{- if $a.hpaAtMax.enabled }}
        - alert: HPAAtMaxReplicas
          expr: |
            max without (job, instance, endpoint, service) (kube_horizontalpodautoscaler_status_current_replicas{namespace!~{{ $ex | quote }}})
            >= max without (job, instance, endpoint, service) (kube_horizontalpodautoscaler_spec_max_replicas)
          for: {{ $a.hpaAtMax.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.hpaAtMax.severity) | nindent 12 }}
          annotations:
            summary: 'HPA {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.horizontalpodautoscaler }}` }} has sat at maxReplicas ({{ `{{ $value }}` }}) for {{ $a.hpaAtMax.for }}'
            description: 'Either the ceiling is too low (a capacity risk) or load is leaking (a cost). Look at the target metric before raising maxReplicas.'
        {{- end }}
        {{- if $a.hpaPinned.enabled }}
        - alert: HPAMinEqualsMax
          expr: |
            max without (job, instance, endpoint, service) (kube_horizontalpodautoscaler_spec_min_replicas{namespace!~{{ $ex | quote }}})
            == max without (job, instance, endpoint, service) (kube_horizontalpodautoscaler_spec_max_replicas)
          for: {{ $a.hpaPinned.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.hpaPinned.severity) | nindent 12 }}
          annotations:
            summary: 'HPA {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.horizontalpodautoscaler }}` }} has minReplicas equal to maxReplicas ({{ `{{ $value }}` }})'
            description: 'Autoscaling is switched off for this workload; it pays for peak capacity all day. Widen the range or remove the HPA.'
        {{- end }}
        {{- if $a.missingRequests.enabled }}
        - alert: ContainersWithoutCPURequests
          expr: |
            count by (namespace) (
              (
                max without (job, instance, endpoint, service) (kube_pod_container_info{namespace!~{{ $ex | quote }}, container!=""})
                * on (namespace, pod) group_left() costwaste:pod_running:bool > 0
              )
              unless on (namespace, pod, container) max without (job, instance, endpoint, service) (kube_pod_container_resource_requests{resource="cpu"})
            ) > 0
          for: {{ $a.missingRequests.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.missingRequests.severity) | nindent 12 }}
          annotations:
            summary: '{{ `{{ $value }}` }} running containers in {{ `{{ $labels.namespace }}` }} have no CPU request'
            description: 'They are invisible to the scheduler, to the autoscaler and to cost allocation. A LimitRange default request is the quickest fix (see the namespace-baseline chart).'
        {{- end }}
        {{- if $a.scaledToZero.enabled }}
        - alert: DeploymentScaledToZero
          expr: max without (job, instance, endpoint, service) (kube_deployment_spec_replicas{namespace!~{{ $ex | quote }}}) == 0
          for: {{ $a.scaledToZero.for }}
          labels:
            {{- include "cw.alertLabels" (dict "root" $ "severity" $a.scaledToZero.severity) | nindent 12 }}
          annotations:
            summary: 'Deployment {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.deployment }}` }} has been scaled to zero for {{ $a.scaledToZero.for }}'
            description: 'Delete it or document why it stays: its PVCs, Secrets, ConfigMaps and LoadBalancers may still cost money.'
        {{- end }}
{{- end }}
