{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cw.fullname" . }}-dashboard
  namespace: {{ .Values.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "cw.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  k8s-cost-waste.json: |-
    {{- .Files.Get "dashboards/cost-waste.json" | replace "__CURRENCY_UNIT__" (printf "currency%s" (.Values.pricing.currency | upper)) | nindent 4 }}
{{- end }}
