# Default values for k8s-cost-waste-alerts.
#
# Needs kube-state-metrics and cAdvisor (kubelet) metrics in Prometheus, which
# kube-prometheus-stack provides. Everything is a PrometheusRule plus a dashboard.

prometheusRule:
  enabled: true
  # Empty = release namespace.
  namespace: ""
  # Labels for the Prometheus Operator ruleSelector (kube-prometheus-stack: release: <name>).
  labels: {}
  interval: 1m

dashboard:
  enabled: true
  namespace: ""
  labels:
    grafana_dashboard: "1"
  annotations: {}

# System namespaces (regex). Alerts ignore them, and the headline "wasted" and savings figures leave them out
# (teams rarely own those requests). Recording rules, the namespace table and "all namespaces" figures still cover them.
excludeNamespaces: "kube-.*|gmp-.*|gke-.*|monitoring|kyverno"

pricing:
  enabled: true
  # ISO code used for the dashboard unit: USD, GBP or EUR.
  currency: USD
  # Where node prices come from:
  #   static        one price per vCPU-hour and GiB-hour for every node (no extra components)
  #   instanceType  hourly price per instance type from `instanceTypes`, spot nodes discounted by `spotDiscount`.
  #                 Needs node labels in kube-state-metrics (see README: metricLabelsAllowlist).
  #   opencost      node prices from OpenCost (node_total_hourly_cost / node_cpu_hourly_cost / node_ram_hourly_cost),
  #                 which reads the AWS, Google Cloud and Azure pricing APIs and knows spot prices.
  source: static
  # Price of one vCPU and one GiB of memory for one hour. Used by `static`, as the fallback for instance types
  # missing from `instanceTypes`, and as the CPU:memory split of an instance price.
  cpuCoreHour: 0.032
  memoryGiBHour: 0.0043
  # instanceType source: on-demand hourly price per node.kubernetes.io/instance-type value.
  instanceTypes: {}
  #  m6i.large: 0.096
  #  m6i.xlarge: 0.192
  #  e2-standard-4: 0.134
  # Share knocked off the on-demand price for nodes labelled spot/preemptible (instanceType source), and the
  # discount assumed by the "move to spot" savings estimate.
  spotDiscount: 0.65
  # Per GiB-month of a PersistentVolume, and per hour of a cloud load balancer (idle-resource savings).
  storageGiBMonth: 0.10
  loadBalancerHour: 0.025

# Savings estimates on the dashboard. They overlap (right-sizing frees capacity that consolidation then removes),
# so read them as separate levers, not a sum.
savings:
  # Share of on-demand node spend that could run on spot (stateless, interruption-tolerant workloads).
  spotEligibleShare: 0.5
  # Discount of a 1-year commitment (Savings Plans, committed use discounts, reservations) on the steady baseline.
  commitmentDiscount: 0.3
  # Share of unrequested node capacity to keep as headroom (not counted as saveable).
  idleHeadroom: 0.2

thresholds:
  # Alert when, averaged over a day, this share of requested CPU/memory is unused ...
  cpuWasteRatio: 0.7
  memoryWasteRatio: 0.7
  # ... and the namespace requests at least this much (ignore tiny namespaces).
  minCpuRequestCores: 2
  minMemoryRequestGiB: 4
  # Alert when requested/allocatable across the cluster stays below this (nodes oversized, autoscaler not scaling in).
  clusterCpuCommitRatio: 0.4
  clusterMemoryCommitRatio: 0.4

alerts:
  namespaceOverRequested:
    enabled: true
    severity: warning
    for: 1h
  clusterUnderCommitted:
    enabled: true
    severity: info
    for: 6h
  idlePvc:
    enabled: true
    severity: info
    for: 7d
  unusedLoadBalancer:
    enabled: true
    severity: warning
    for: 1d
  hpaAtMax:
    enabled: true
    severity: info
    for: 2h
  hpaPinned:
    enabled: true
    severity: info
    for: 1h
  missingRequests:
    enabled: true
    severity: info
    for: 1h
  scaledToZero:
    enabled: true
    severity: info
    for: 7d

# Extra labels on every alert (team, routing keys).
alertLabels: {}
