apiVersion: v2
name: gateway-api-baseline
description: A shared Kubernetes Gateway API ingress baseline - one Gateway per cluster or environment with HTTP-to-HTTPS redirect, TLS listeners per hostname, namespace-scoped route attachment, HTTPRoutes and GRPCRoutes from values with timeouts and security headers filled in, automatic ReferenceGrants, a catch-all backend and BackendTLSPolicies. Works with GKE Gateway, Envoy Gateway, NGINX Gateway Fabric, Istio, Cilium and Traefik.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://www.oreonit.com/containerization-orchestration-management-kubernetes-openshift/
