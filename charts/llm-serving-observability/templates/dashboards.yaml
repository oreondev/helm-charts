{{- if .Values.dashboards.enabled }}
{{- range $file, $want := dict "vllm.json" .Values.vllm.enabled "gpu.json" .Values.gpu.enabled }}
{{- if $want }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lso.fullname" $ }}-{{ trimSuffix ".json" $file }}
  namespace: {{ $.Values.dashboards.namespace | default $.Release.Namespace }}
  labels:
    {{- include "lso.labels" $ | nindent 4 }}
    {{- with $.Values.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $.Values.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ $file }}: |-
    {{- $.Files.Get (printf "dashboards/%s" $file) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
