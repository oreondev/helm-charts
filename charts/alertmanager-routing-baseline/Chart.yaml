apiVersion: v2
name: alertmanager-routing-baseline
description: Alertmanager routing from one values file - teams, page and ticket receivers (Slack, PagerDuty, Opsgenie, email, Teams, webhook), severity routing, critical-inhibits-warning and page-inhibits-ticket rules, business-hours mute windows and a Watchdog sink. Rendered as an AlertmanagerConfig for the Prometheus Operator.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
home: https://www.oreonit.com/sre-as-a-service/
