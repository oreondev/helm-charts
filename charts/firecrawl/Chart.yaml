apiVersion: v2
name: firecrawl
description: Firecrawl (web scraping and crawling API for LLMs) on Kubernetes - API, queue workers and Playwright as separate Deployments with their own resources, probes and scaling, a token gate (self-hosted Firecrawl accepts any key), NuQ queue on bundled or managed PostgreSQL with the schema applied per release and WAL sized for the volume, KEDA scaling on queue depth, pinned image digests, non-root and read-only, NetworkPolicy, PodMonitor, alerts and a Grafana dashboard.
type: application
version: 0.1.1
appVersion: "2.11.621"
kubeVersion: ">=1.25.0-0"
home: https://www.oreonit.com/private-llm-hosting-and-operations/
icon: https://raw.githubusercontent.com/oreondev/helm-charts/main/icon.png
sources:
  - https://github.com/oreondev/helm-charts
  - https://github.com/firecrawl/firecrawl
keywords:
  - firecrawl
  - web-scraping
  - crawler
  - llm
  - rag
  - playwright
  - keda
  - ai
maintainers:
