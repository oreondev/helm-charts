{{- if .Values.networkPolicy.enabled }}
{{- $ctx := dict "ctx" . "component" "api" }}
# API pods: the token gate is open to all, the API port only to this release, and the internal admin
# listener (queue metrics and admin routes without a key) only to the monitoring namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "firecrawl.fullname" . }}-api
  labels:
    {{- include "firecrawl.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "firecrawl.selectorLabels" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.auth.enabled }}
    - ports:
        - { port: 8080, protocol: TCP }
    {{- end }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: {{ include "firecrawl.name" . }}
      ports:
        - { port: 3002, protocol: TCP }
    {{- if not .Values.auth.enabled }}
    - ports:
        - { port: 3002, protocol: TCP }
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - { port: 3010, protocol: TCP }
    {{- end }}
{{- end }}
