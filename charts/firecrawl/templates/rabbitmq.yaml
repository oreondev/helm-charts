{{- if eq .Values.rabbitmq.mode "bundled" }}
{{- $v := .Values }}
{{- $r := $v.rabbitmq.bundled }}
{{- $ctx := dict "ctx" . "component" "rabbitmq" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firecrawl.fullname" . }}-rabbitmq
  labels:
    {{- include "firecrawl.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "firecrawl.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firecrawl.selectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ include "firecrawl.serviceAccountName" . }}
      automountServiceAccountToken: {{ $v.automountServiceAccountToken }}
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ $r.image.repository }}:{{ $r.image.tag }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: firecrawl }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: {{ include "firecrawl.fullname" . }}, key: RABBITMQ_PASSWORD } }
          ports:
            - { name: amqp, containerPort: 5672, protocol: TCP }
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, check_port_connectivity] }
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, status] }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 15
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: etc, mountPath: /etc/rabbitmq/conf.d/90-chart.conf, subPath: 90-chart.conf, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: etc
          configMap:
            name: {{ include "firecrawl.fullname" . }}-rabbitmq
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firecrawl.fullname" . }}-rabbitmq
  labels:
    {{- include "firecrawl.labels" $ctx | nindent 4 }}
data:
  90-chart.conf: |
    loopback_users.guest = true
    vm_memory_high_watermark.relative = 0.6
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firecrawl.fullname" . }}-rabbitmq
  labels:
    {{- include "firecrawl.labels" $ctx | nindent 4 }}
spec:
  ports:
    - { name: amqp, port: 5672, targetPort: amqp, protocol: TCP }
  selector:
    {{- include "firecrawl.selectorLabels" $ctx | nindent 4 }}
{{- end }}
