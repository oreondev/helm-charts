{{- if and .Values.metrics.enabled .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firecrawl.fullname" . }}-grafana-dashboard
  labels:
    {{- include "firecrawl.labels" (dict "ctx" . "component" "api") | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  firecrawl.json: |-
    {{- .Files.Get "dashboards/firecrawl.json" | nindent 4 }}
{{- end }}
