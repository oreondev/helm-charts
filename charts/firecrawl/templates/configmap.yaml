apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firecrawl.fullname" . }}-env
  labels:
    {{- include "firecrawl.labels" (dict "ctx" . "component" "api") | nindent 4 }}
data:
  {{- include "firecrawl.env" . | trim | nindent 2 }}
{{- if .Values.auth.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firecrawl.fullname" . }}-gateway
  labels:
    {{- include "firecrawl.labels" (dict "ctx" . "component" "api") | nindent 4 }}
data:
  nginx.conf: |
    {{- include "firecrawl.gatewayConf" . | nindent 4 }}
{{- end }}
