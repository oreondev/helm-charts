{{- $ctx := dict "ctx" . "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firecrawl.fullname" . }}
  labels:
    {{- include "firecrawl.labels" $ctx | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # The token gate, or the API itself with auth.enabled=false.
      targetPort: {{ ternary "http" "app" .Values.auth.enabled }}
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "firecrawl.selectorLabels" $ctx | nindent 4 }}
