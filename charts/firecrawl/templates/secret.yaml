{{- $data := include "firecrawl.secretData" . | fromYaml }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "firecrawl.fullname" . }}
  labels:
    {{- include "firecrawl.labels" (dict "ctx" . "component" "api") | nindent 4 }}
stringData:
  {{- omit $data "api-keys" | toYaml | nindent 2 }}
{{- if .Values.auth.enabled }}
---
# The gateway's key map ("Bearer <key>" 1;), one line per key.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "firecrawl.fullname" . }}-gateway-keys
  labels:
    {{- include "firecrawl.labels" (dict "ctx" . "component" "api") | nindent 4 }}
stringData:
  {{- if .Values.auth.existingSecret }}
  {{- $src := lookup "v1" "Secret" .Release.Namespace .Values.auth.existingSecret }}
  {{- $raw := "" }}
  {{- if $src }}{{ $raw = get ($src.data | default dict) .Values.auth.existingSecretKey | b64dec }}{{ end }}
  keys.map: |
    {{- range splitList "\n" $raw }}{{ with trim . }}
    "Bearer {{ . }}" 1;
    {{- end }}{{ end }}
  {{- else }}
  api-keys: {{ get $data "api-keys" | quote }}
  keys.map: |
    {{- range splitList "\n" (get $data "api-keys") }}{{ with trim . }}
    "Bearer {{ . }}" 1;
    {{- end }}{{ end }}
  {{- end }}
{{- end }}
