{{- $_ := include "tei.models" . }}
{{- $data := include "tei.secretData" . | fromYaml }}
{{- if $data }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "tei.fullname" . }}
  labels:
    {{- include "tei.labels" (dict "ctx" .) | nindent 4 }}
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
