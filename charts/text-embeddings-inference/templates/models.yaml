{{- $v := .Values }}
{{- $secretName := include "tei.fullname" . }}
{{- range (include "tei.models" . | fromJson).models }}
{{- $m := . }}
{{- $ctx := dict "ctx" $ "model" $m.name }}
{{- $name := printf "%s-%s" (include "tei.fullname" $) $m.name }}
{{- $gpu := not (hasPrefix "cpu" $m.accelerator) }}
{{- $sts := eq $m.cache.mode "persistent" }}
{{- $tag := default (printf "%s%s" (include "tei.variant" $m.accelerator) $.Chart.AppVersion) $v.image.tag }}
{{- $hpa := or $m.autoscaling.enabled $m.autoscaling.keda.enabled }}
---
apiVersion: apps/v1
kind: {{ ternary "StatefulSet" "Deployment" $sts }}
metadata:
  name: {{ $name }}
  labels:
    {{- include "tei.labels" $ctx | nindent 4 }}
  annotations:
    text-embeddings-inference/model-id: {{ $m.modelId | quote }}
spec:
  {{- if not $hpa }}
  replicas: {{ $m.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  {{- if $sts }}
  serviceName: {{ $name }}
  podManagementPolicy: Parallel
  {{- else if $gpu }}
  # A GPU pod holds its device until it exits: start the new one after the old one is gone.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "tei.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tei.selectorLabels" $ctx | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include "tei.secretData" $ | sha256sum }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tei.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $v.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- with $v.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $m.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: tei
          image: {{ $v.image.repository }}:{{ $tag }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          args:
            - --model-id={{ $m.modelId }}
            {{- with $m.revision }}
            - --revision={{ . }}
            {{- end }}
            - --served-model-name={{ $m.name }}
            {{- with $m.dtype }}
            - --dtype={{ . }}
            {{- end }}
            {{- with $m.pooling }}
            - --pooling={{ . }}
            {{- end }}
            - --max-concurrent-requests={{ int $m.maxConcurrentRequests }}
            - --max-batch-tokens={{ int $m.maxBatchTokens }}
            - --max-client-batch-size={{ int $m.maxClientBatchSize }}
            - --payload-limit={{ int $m.payloadLimit }}
            {{- if $m.autoTruncate }}
            - --auto-truncate
            {{- end }}
            - --json-output
            {{- range $m.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            # The image listens on 80, which a non-root container cannot bind.
            - { name: PORT, value: "8080" }
            - { name: HUGGINGFACE_HUB_CACHE, value: /data }
            {{- if not $gpu }}
            # The image fixes 8 compute threads whatever the CPU; size the pools to the pod (on 2 CPUs the
            # throughput was the same, the point is not to oversubscribe small pods on large nodes).
            - { name: RAYON_NUM_THREADS, value: {{ include "tei.cpus" $m.resources | quote }} }
            - { name: TOKENIZATION_WORKERS, value: {{ include "tei.cpus" $m.resources | quote }} }
            {{- end }}
            {{- if $v.auth.enabled }}
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: {{ default $secretName $v.auth.existingSecret }}, key: {{ ternary $v.auth.existingSecretKey "api-key" (not (empty $v.auth.existingSecret)) }} } }
            {{- end }}
            {{- if or $v.huggingface.token $v.huggingface.existingSecret }}
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: {{ default $secretName $v.huggingface.existingSecret }}, key: {{ ternary $v.huggingface.existingSecretKey "hf-token" (not (empty $v.huggingface.existingSecret)) }} } }
            {{- end }}
            {{- with $m.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ $v.probes.startup.periodSeconds }}
            failureThreshold: {{ $v.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ $v.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ $v.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ $v.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ $v.probes.readiness.timeoutSeconds }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          resources:
            {{- $res := deepCopy ($m.resources | default dict) }}
            {{- if $gpu }}
            {{- $lim := mergeOverwrite (dict "nvidia.com/gpu" 1) ($res.limits | default dict) }}
            {{- $_ := set $res "limits" $lim }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data{{ if eq $m.cache.mode "existingClaim" }}, subPath: hub{{ end }} }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        {{- if eq $m.cache.mode "emptyDir" }}
        - name: data
          emptyDir:
            sizeLimit: {{ $m.cache.size }}
        {{- else if eq $m.cache.mode "existingClaim" }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ required (printf "models[%s].cache.existingClaim is required with cache.mode=existingClaim" $m.name) $m.cache.existingClaim }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $m.tolerations $gpu }}
      tolerations:
        {{- with $m.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $gpu }}
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
        {{- end }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "tei.selectorLabels" $ctx | nindent 14 }}
  {{- if $sts }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "tei.selectorLabels" $ctx | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $m.cache.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.cache.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tei.labels" $ctx | nindent 4 }}
  {{- with $v.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  ports:
    - { name: http, port: {{ $v.service.port }}, targetPort: http, protocol: TCP, appProtocol: http }
  selector:
    {{- include "tei.selectorLabels" $ctx | nindent 4 }}
{{- if and $v.podDisruptionBudget.enabled (or $hpa (gt (int $m.replicaCount) 1)) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "tei.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $v.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "tei.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- if $m.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "tei.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ ternary "StatefulSet" "Deployment" $sts }}
    name: {{ $name }}
  minReplicas: {{ $m.autoscaling.minReplicas }}
  maxReplicas: {{ $m.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $m.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if $m.autoscaling.keda.enabled }}
---
# Scale on TEI's request queue (te_queue_size), the signal that holds for GPU models where CPU does not.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels:
    {{- include "tei.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    kind: {{ ternary "StatefulSet" "Deployment" $sts }}
    name: {{ $name }}
  minReplicaCount: {{ $m.autoscaling.minReplicas }}
  maxReplicaCount: {{ $m.autoscaling.maxReplicas }}
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $m.autoscaling.keda.prometheusAddress }}
        query: sum(te_queue_size{namespace="{{ $.Release.Namespace }}", service="{{ $name }}"}) or vector(0)
        threshold: {{ $m.autoscaling.keda.queuedPerReplica | quote }}
{{- end }}
{{- end }}
