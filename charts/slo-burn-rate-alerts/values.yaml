#      totalQuery: sum(rate(http_requests_total{job="api"}[$WINDOW]))
#    alerting:                       # optional per-SLO overrides
#      page:
#        enabled: true
#        severity: critical
#        for: 2m
#      ticket:
#        enabled: true
#        severity: warning
#        for: 15m
#      annotations:
#        runbook_url: https://runbooks.example.com/api-availability

# SLOs in the OpenSLO v1 format, as a list here or as one multi-document YAML string
# (helm install ... --set-file openslo=slos.yaml). They become the same rules, alerts and dashboard rows as `slos`.
# Supported: kind SLO (inline indicator, or indicatorRef to a kind SLI in this list), budgetingMethod Occurrences,
# one objective, a rolling timeWindow equal to sloPeriodDays (30d; 28d or 4w with sloPeriodDays: 28), ratioMetric
# good/total or bad/total on Prometheus. Write the range as $WINDOW or Sloth's {{.window}}; a plain counter selector
# with `counter: true` needs no range. alertPolicies are ignored: alerting comes from `alerting` above.
openslo: []
