apiVersion: v2
name: slo-burn-rate-alerts
description: SLOs as values. Generates Prometheus recording rules, multi-window multi-burn-rate page and ticket alerts, and a Grafana SLO / error-budget dashboard for Prometheus Operator and kube-prometheus-stack.
type: application
version: 0.3.1
appVersion: "0.3.0"
kubeVersion: ">=1.25.0-0"
home: https://www.oreonit.com/observability-and-monitoring-consultancy-services/
icon: https://raw.githubusercontent.com/oreondev/helm-charts/main/icon.png
sources:
  - https://github.com/oreondev/helm-charts
keywords:
  - slo
  - sli
  - error-budget
  - burn-rate
  - sre
  - prometheus
  - prometheus-operator
  - kube-prometheus-stack
  - alerting
  - grafana
  - observability
  - openslo
maintainers:
  - name: Oreon IT
    email: info@oreonit.com
    url: https://www.oreonit.com/
annotations:
